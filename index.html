<!DOCTYPE html>
<html lang="en-US">
  <head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="keywords" content="front-end web developer, unblocked, games, google sites, unblocked games mom, ublocked, code, coding, programmer, development, javascript, jquery, bootstrap, sass, less, git" />
    <meta property="og:title" content="Welcome to Gold Card Games!" />
    <meta property="og:site_name" content="3kh0.github.io" />
    <meta property="og:description" content="Welcome to Gold Card Games!" />
    <meta name="description" content="Welcome to Gold Card Games!" />
    <meta name="author" content="Gold Card SCS" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3kh0 lite</title>
    <link rel="stylesheet" href="/css/theme.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
      }

      .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem 2rem;
        text-align: center;
      }

      .logo-wrap {
        width: 120px;
        height: 120px;
        margin: 0 auto 1.8rem;
        border: 2px solid var(--border);
        background: var(--bg-card);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .logo-wrap::before {
        content: '';
        position: absolute;
        inset: 5px;
        border: 1px solid var(--border);
        pointer-events: none;
      }

      .logo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .logo-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.3rem;
        width: 100%;
        height: 100%;
        color: var(--cream-dim);
        font-family: 'Cinzel', serif;
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.6;
        text-align: center;
        padding: 0.5rem;
      }

      .logo-placeholder .icon {
        font-size: 2rem;
        opacity: 0.5;
        line-height: 1;
      }

      .site-title {
        font-family: 'Cinzel', serif;
        font-size: 3rem;
        font-weight: 700;
        color: var(--gold-light);
        letter-spacing: 0.1em;
        margin: 0 0 0.2rem;
        line-height: 1.1;
      }

      #subtitle {
        display: block;
        font-style: italic;
        color: var(--cream-dim);
        font-size: 1.05rem;
        min-height: 1.6em;
        margin-bottom: 1.8rem;
      }

      .hero-divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        width: 100%;
        max-width: 420px;
        margin: 0 auto 1.8rem;
        color: var(--gold-dark);
      }

      .hero-divider::before,
      .hero-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border), transparent);
      }

      .welcome-text {
        color: var(--cream-dim);
        font-size: 1rem;
        margin: 0 0 2rem;
        max-width: 480px;
      }

      .cta-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
      }

      .footer-copy {
        margin-top: auto;
      }
    </style>
  </head>
  <body>

    <header class="site-header">
      <a href="/" class="brand">
        <span class="brand-name">3kh0 lite</span>
      </a>
      <nav class="site-nav">
        <a href="/projects.html" class="nav-link">Games</a>
        <a href="/misc.html" class="nav-link">Tools</a>
      </nav>
    </header>

    <main class="hero">

      <div class="logo-wrap" id="logo-wrap">
        <img id="site-logo" src="/favicon.ico" alt="Site Logo" style="display:block;" />
        <div id="logo-placeholder" class="logo-placeholder" style="display:none;">
          <img src="/favicon.ico" alt="" style="width:62px; height:62px; object-fit:contain; display:block;" />
        </div>
      </div>

      <h1 class="site-title">Gold Card Games</h1>
      <span id="subtitle">...</span>

      <div class="hero-divider">⚜</div>

      <p class="welcome-text">Welcome to Gold Card Games!</p>

      <div class="cta-group">
        <a href="/projects.html" class="btn btn-primary">Games</a>
        <a href="/misc.html" class="btn btn-secondary">Tab Cloaker</a>
      </div>

    </main>

    <footer class="site-footer footer-copy">
      &copy; 3kh0, 2024. All rights reserved. You are welcome to use and/or duplicate material from the
      <a href="https://github.com/3kh0/3kh0-lite">GitHub repository</a> with proper credit to 3kh0.<br />
      Contact Echo at <a href="mailto:echo-the-coder@tuta.io">echo-the-coder@tuta.io</a>.
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/subtitle.js"></script>
  </body>
</html>
