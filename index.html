<!DOCTYPE html>
<html lang="en-US">
  <head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="keywords" content="front-end web developer, unblocked, games, google sites, unblocked games mom, ublocked, code, coding, programmer, development, javascript, jquery, bootstrap, sass, less, git" />
    <meta property="og:title" content="Welcome to Gold Card Games!" />
    <meta property="og:site_name" content="3kh0.github.io" />
    <meta property="og:description" content="Welcome to Gold Card Games!" />
    <meta name="description" content="Welcome to Gold Card Games!" />
    <meta name="author" content="Gold Card SCS" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3kh0 lite</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        background-color: #050510;
        color: #ffffff;
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }

      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.15) 2px,
          rgba(0, 0, 0, 0.15) 4px
        );
        pointer-events: none;
        z-index: 1;
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }

      h1 {
        font-size: 4em;
        margin: 0 0 0.2em 0;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #00ffff;
        text-shadow:
          0 0 7px #00ffff,
          0 0 20px #00ffff,
          0 0 45px #00ffff,
          0 0 80px #0099ff;
        animation: flicker 4s infinite alternate;
      }

      @keyframes flicker {
        0%, 95%, 100% { opacity: 1; }
        96% { opacity: 0.85; }
        97% { opacity: 1; }
        98% { opacity: 0.6; }
        99% { opacity: 1; }
      }

      #subtitle {
        font-size: 1.3em;
        color: #ff00ff;
        text-shadow:
          0 0 7px #ff00ff,
          0 0 20px #ff00ff,
          0 0 40px #cc00cc;
        letter-spacing: 0.05em;
        min-height: 2em;
        display: block;
        margin-bottom: 0.5em;
      }

      .welcome-text {
        color: #aaaacc;
        font-size: 0.95em;
        letter-spacing: 0.05em;
        margin: 1em 0 1.5em 0;
        max-width: 500px;
        line-height: 1.6;
      }

      .btn-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-bottom: 2rem;
      }

      .neon-btn {
        cursor: pointer;
        border: 2px solid;
        background: transparent;
        color: white;
        padding: 14px 40px;
        font-size: 1em;
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        text-decoration: none;
        display: inline-block;
        position: relative;
        transition: background 0.2s, box-shadow 0.2s, color 0.2s;
      }

      .neon-btn-green {
        border-color: #00ff88;
        color: #00ff88;
        text-shadow: 0 0 8px #00ff88;
        box-shadow: 0 0 10px #00ff8840, inset 0 0 10px #00ff8810;
      }

      .neon-btn-green:hover {
        background: #00ff8820;
        box-shadow: 0 0 25px #00ff88, inset 0 0 20px #00ff8820;
        color: #ffffff;
        text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
      }

      .neon-btn-purple {
        border-color: #cc00ff;
        color: #cc00ff;
        text-shadow: 0 0 8px #cc00ff;
        box-shadow: 0 0 10px #cc00ff40, inset 0 0 10px #cc00ff10;
      }

      .neon-btn-purple:hover {
        background: #cc00ff20;
        box-shadow: 0 0 25px #cc00ff, inset 0 0 20px #cc00ff20;
        color: #ffffff;
        text-shadow: 0 0 10px #cc00ff, 0 0 20px #cc00ff;
      }

      .footer {
        position: relative;
        z-index: 2;
        font-size: 0.75em;
        color: #445566;
        text-align: center;
        max-width: 600px;
        padding: 0 1rem 2rem 1rem;
        line-height: 1.8;
      }

      .footer a {
        color: #00ffff;
        text-decoration: none;
        text-shadow: 0 0 6px #00ffff80;
      }

      .footer a:hover {
        text-shadow: 0 0 12px #00ffff;
        color: #ffffff;
      }

      .corner-decoration {
        position: fixed;
        width: 60px;
        height: 60px;
        z-index: 2;
        opacity: 0.4;
      }

      .corner-decoration::before,
      .corner-decoration::after {
        content: '';
        position: absolute;
        background: #00ffff;
        box-shadow: 0 0 6px #00ffff;
      }

      .corner-decoration::before { width: 100%; height: 2px; }
      .corner-decoration::after  { width: 2px; height: 100%; }

      .top-left    { top: 20px; left: 20px; }
      .top-right   { top: 20px; right: 20px; transform: scaleX(-1); }
      .bottom-left { bottom: 20px; left: 20px; transform: scaleY(-1); }
      .bottom-right{ bottom: 20px; right: 20px; transform: scale(-1); }
    </style>
  </head>
  <body>
    <div class="corner-decoration top-left"></div>
    <div class="corner-decoration top-right"></div>
    <div class="corner-decoration bottom-left"></div>
    <div class="corner-decoration bottom-right"></div>

    <div class="content">
      <h1>3kh0 lite</h1>
      <span id="subtitle">...</span>
      <p class="welcome-text">
        Welcome to Gold Card Games!
      </p>
      <div class="btn-group">
        <a href="/projects.html" style="text-decoration: none;">
          <button class="neon-btn neon-btn-green">Games</button>
        </a>
        <a href="/misc.html" style="text-decoration: none;">
          <button class="neon-btn neon-btn-purple">Tab Cloaker</button>
        </a>
      </div>
    </div>

    <div class="footer">
      &copy; 3kh0, 2024. All rights reserved. You are welcome to use and/or duplicate material from the
      <a href="https://github.com/3kh0/3kh0-lite">GitHub repository</a> with proper credit to 3kh0.<br /><br />
      Contact Echo at <a href="mailto:echo-the-coder@tuta.io">echo-the-coder@tuta.io</a>.
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/subtitle.js"></script>
  </body>
</html>
