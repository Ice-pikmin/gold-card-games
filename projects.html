<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Projects | Gold Card Games</title>
    <meta name="keywords" content="front-end web developer, unblocked, games, google sites, unblocked games mom, ublocked, code, coding, programmer, development, javascript, jquery, bootstrap, sass, less, git" />
    <meta property="og:title" content="Welcome to 3kh0 lite, a lightweight, fast, and clean game site." />
    <meta property="og:site_name" content="3kh0.github.io" />
    <meta property="og:description" content="Welcome to 3kh0 lite, a lightweight, fast, and clean game site." />
    <meta name="description" content="Welcome to 3kh0 lite, a lightweight, fast, and clean game site." />
    <meta name="author" content="3kh0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="shortcut-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/main.js"></script>
  </head>
  <body>

    <header class="site-header">
      <a href="/" class="brand">
        <span class="brand-name">Gold Card Games</span>
      </a>
      <nav class="site-nav">
        <a href="/projects.html" class="nav-link" style="color:var(--gold-light); border-color:var(--border);">Games</a>
        <a href="/misc.html" class="nav-link">Tools</a>
      </nav>
    </header>

    <div class="page-wrap">
      <h1 class="page-title">The Game Hall</h1>
      <p class="page-subtitle">Browse the archives and choose your pursuit</p>

      <div class="ornament">⚜</div>

      <div class="search-wrap">
        <input type="text" id="search" onkeyup="searchGames()" placeholder="Search the archives..." />
      </div>

      <div id="loader"></div>
      <div id="game-container" class="flex-container"></div>

      <div style="text-align:center; margin-top:3rem;">
        <a href="/index.html" class="btn btn-secondary">Return to Keep</a>
      </div>
    </div>

    <button id="back-to-top" class="btn btn-primary" style="display:none;">&#8593; Top</button>

    <script>
      let games = [];
      fetch("config/games.json")
      .then((response) => response.json())
      .then((data) => {
        games = data;
        const container = document.getElementById("game-container");
        data.forEach((project) => {
          const game = document.createElement("a");
          game.href = project.link;
            game.className = "game-link container";
            game.innerHTML = `
            <div class="game-tile">
              <img class="game-icon" src="${project.imgSrc}" alt="icon" />
              <p class="game-title">${project.title}</p>
              </div>`;
              container.appendChild(game);
          });
          document.getElementById("loader").style.display = "none";
        })
        .catch((error) => console.error("Error:", error));

      function searchGames() {
        const input = document.getElementById("search");
        const filter = input.value.toUpperCase();
        const container = document.getElementById("game-container");
        container.innerHTML = "";
        games
          .filter((game) => game.title.toUpperCase().includes(filter))
          .forEach((project) => {
            const game = document.createElement("a");
            game.href = project.link;
            game.className = "game-link container";
            game.innerHTML = `
            <div class="game-tile">
              <img class="game-icon" src="${project.imgSrc}" alt="icon" loading="lazy" />
              <p class="game-title">${project.title}</p>
              </div>`;
            container.appendChild(game);
          });
        }
        const backToTopButton = document.getElementById('back-to-top');
        window.onscroll = function () {
          if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
            backToTopButton.style.display = "block";
          } else {
          backToTopButton.style.display = "none";
        }
      };

      backToTopButton.onclick = function () {
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;
      };
    </script>
  </body>
</html>
